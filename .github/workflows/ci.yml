name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    name: Typecheck, lint & tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # The start files download portable Node on a fresh machine; force that path and
      # stop before the menu, so a broken start file fails CI instead of a user's first run
      - name: Start file (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          DARKROOM_FORCE_PORTABLE_NODE: '1'
        run: call "Start Darkroom (Windows).bat" --bootstrap-only

      - name: Start file (macOS)
        if: runner.os == 'macOS'
        env:
          DARKROOM_FORCE_PORTABLE_NODE: '1'
        run: bash "Start Darkroom (Mac).command" --bootstrap-only

      - name: Start file (Linux)
        if: runner.os == 'Linux'
        env:
          DARKROOM_FORCE_PORTABLE_NODE: '1'
        run: bash launcher/start-linux.sh --bootstrap-only

      # Work an update leaves for the next start, because Windows locks the running node.exe and
      # its folder: a listed old Node folder is removed, and a deferred runtime\ move happens,
      # before Node runs
      - name: Start file finishes deferred work (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          DARKROOM_FORCE_PORTABLE_NODE: '1'
        run: |
          mkdir "dependencies\runtime\node\node-v0.0.1-win-x64"
          echo node-v0.0.1-win-x64> "dependencies\runtime\node\.remove"
          call "Start Darkroom (Windows).bat" --bootstrap-only || exit /b 1
          if exist "dependencies\runtime\node\node-v0.0.1-win-x64" (echo The listed Node folder was not removed & exit /b 1)
          if exist "dependencies\runtime\node\.remove" (echo .remove was not cleared & exit /b 1)
          move "dependencies\runtime" "runtime" || exit /b 1
          type nul > "runtime\.move-to-dependencies"
          call "Start Darkroom (Windows).bat" --bootstrap-only || exit /b 1
          if exist "runtime" (echo runtime was not moved into dependencies & exit /b 1)
          if not exist "dependencies\runtime\node" (echo dependencies\runtime is missing after the move & exit /b 1)
          if exist "dependencies\runtime\.move-to-dependencies" (echo The move note was left behind & exit /b 1)

      - name: Start file finishes deferred work (macOS / Linux)
        if: runner.os != 'Windows'
        env:
          DARKROOM_FORCE_PORTABLE_NODE: '1'
          START: ${{ runner.os == 'macOS' && 'Start Darkroom (Mac).command' || 'launcher/start-linux.sh' }}
        run: |
          mkdir -p dependencies/runtime/node/node-v0.0.1-test
          printf 'node-v0.0.1-test\r\n' > dependencies/runtime/node/.remove
          bash "$START" --bootstrap-only
          test ! -e dependencies/runtime/node/node-v0.0.1-test
          test ! -e dependencies/runtime/node/.remove
