name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    name: Typecheck, lint & tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # The start files download portable Node on a fresh machine; force that path and
      # stop before the menu, so a broken start file fails CI instead of a user's first run
      - name: Start file (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          DARKROOM_FORCE_PORTABLE_NODE: '1'
        run: call "Start Darkroom (Windows).bat" --bootstrap-only

      - name: Start file (macOS)
        if: runner.os == 'macOS'
        env:
          DARKROOM_FORCE_PORTABLE_NODE: '1'
        run: bash "Start Darkroom (Mac).command" --bootstrap-only

      - name: Start file (Linux)
        if: runner.os == 'Linux'
        env:
          DARKROOM_FORCE_PORTABLE_NODE: '1'
        run: bash launcher/start-linux.sh --bootstrap-only
